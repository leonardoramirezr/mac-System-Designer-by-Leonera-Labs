<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e9ee"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f80ff"/>
      <stop offset="1" stop-color="#0a5fe0"/>
    </linearGradient>
    <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse" x="14" y="14">
      <circle cx="22" cy="22" r="3.2" fill="#d2d2d8"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1a2a4a" flood-opacity="0.16"/>
    </filter>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="824" fill="url(#dots)" opacity="0.9"/>
  </g>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185.5" fill="none" stroke="#000" stroke-opacity="0.06"/>
  <!-- group -->
  <rect x="430" y="248" width="400" height="528" rx="48" fill="#eaf2ff" stroke="#8fb8ff" stroke-width="10" stroke-dasharray="26 18"/>
  <!-- edges -->
  <g fill="none" stroke="#8b8b96" stroke-width="16" stroke-linecap="round">
    <path d="M322 512 H488"/>
    <path d="M610 470 C 660 470, 650 382, 690 382"/>
    <path d="M610 554 C 660 554, 650 642, 690 642"/>
  </g>
  <!-- client (circle) -->
  <g filter="url(#soft)">
    <circle cx="256" cy="512" r="78" fill="#ffffff" stroke="#d8d8de" stroke-width="6"/>
  </g>
  <g transform="translate(206 462) scale(4.1667)" fill="none" stroke="#2c2c30" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>
  </g>
  <!-- server (accent tile) -->
  <g filter="url(#soft)">
    <rect x="482" y="424" width="176" height="176" rx="42" fill="url(#tile)"/>
  </g>
  <g transform="translate(520 462) scale(4.1667)" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><path d="M6 6h.01M6 18h.01"/>
  </g>
  <!-- database + queue tiles -->
  <g filter="url(#soft)">
    <rect x="690" y="318" width="128" height="128" rx="32" fill="#ffffff" stroke="#d8d8de" stroke-width="6"/>
    <rect x="690" y="578" width="128" height="128" rx="32" fill="#ffffff" stroke="#d8d8de" stroke-width="6"/>
  </g>
  <g transform="translate(718 346) scale(3)" fill="none" stroke="#2c2c30" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/>
  </g>
  <g transform="translate(718 606) scale(3)" fill="none" stroke="#2c2c30" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 12H3"/><path d="M16 6H3"/><path d="M10 18H3"/><path d="M21 6v10a2 2 0 0 1-2 2h-4"/><path d="m16 16-2 2 2 2"/>
  </g>
</svg>
